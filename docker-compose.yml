services:
  produtor-host:
    build: ./src/java/03-socket/
    container_name: conteiner_produtor
    working_dir: /app
    volumes:
      - ./src/java/03-socket:/app
    command: sh -c "javac ProdutorServer.java && java ProdutorServer"
    ports:
      - "5000:5000"
    networks:
      - rede_ipc

  consumidor-host:
    build: ./src/java/03-socket/
    container_name: conteiner_consumidor
    working_dir: /app
    volumes:
      - ./src/java/03-socket:/app
    command: sh -c "javac ConsumidorClient.java && java ConsumidorClient"
    environment:
      - PRODUTOR_HOST=produtor-host
    depends_on:
      - produtor-host
    networks:
      - rede_ipc

networks:
  rede_ipc:
    driver: bridge